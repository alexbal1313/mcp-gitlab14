
gitlab.base.uri = https://gitlab.example.com
gitlab.token=${TOKEN_GITLAB}

# Bind the URI to the REST client via configKey
quarkus.rest-client.gitlab-client.uri=${gitlab.base.uri}

quarkus.http.port=8004
quarkus.http.host=0.0.0.0

# Publish write tools (issues, merge requests, CI/CD); default false
gitlab.write.enabled=${GITLAB_WRITE_ENABLED:false}
